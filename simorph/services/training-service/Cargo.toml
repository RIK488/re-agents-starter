description = "SIMORPH training service: in-process, Python (sandboxed) and external trainers, synthetic dataset generation with provenance, PyTorch/TRL/PEFT script templates."

[dependencies]
simorph-core = { path = "../../crates/simorph-core" }
simorph-security = { path = "../../crates/simorph-security" }
