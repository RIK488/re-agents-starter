[workspace]
resolver = "2"
members = [

    "crates/simorph-core",
    "crates/simorph-units",
    "crates/simorph-provenance",
    "crates/simorph-model-registry",
    "crates/simorph-simulation",
    "crates/simorph-cosimulation",
    "crates/simorph-experiment",
    "crates/simorph-optimization",
    "crates/simorph-uncertainty",
    "crates/simorph-validation",
    "crates/simorph-scheduler",
    "crates/simorph-execution",
    "crates/simorph-orchestrator",
    "crates/simorph-plugin-sdk",
    "crates/simorph-security",
    "crates/simorph-telemetry",
    "crates/simorph-knowledge",
    "services/scientific-director",
    "services/campaign-runtime",
    "services/ai-laboratory",
    "services/model-factory",
    "services/simulator-factory",
    "services/evaluation-service",
    "services/training-service",
    "services/knowledge-service",
    "plugins/physics",
    "plugins/engineering",
    "plugins/ai",
    "adapters/python-bridge",
    "adapters/fmi",
    "apps/cli",
    "apps/web",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"
repository = "https://github.com/rik488/re-agents-starter"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = { version = "0.8", features = ["uuid1", "chrono", "indexmap2"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"
async-trait = "0.1"
nalgebra = "0.33"
