[package]
name = "simorph-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SIMORPH HTTP API and web interface. Every route maps to an action of the shared action library; the UI only renders implemented actions."

[dependencies]
base64 = "0.22"
sha2.workspace = true
hex.workspace = true
simorph-core = { path = "../../crates/simorph-core" }
simorph-units = { path = "../../crates/simorph-units" }
simorph-telemetry = { path = "../../crates/simorph-telemetry" }
simorph-security = { path = "../../crates/simorph-security" }
simorph-provenance = { path = "../../crates/simorph-provenance" }
simorph-svc-scientific-director = { path = "../../services/scientific-director" }
simorph-cli = { path = "../cli" }
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
tracing.workspace = true
parking_lot.workspace = true
chrono.workspace = true

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
