[package]
name = "simorph-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SIMORPH command-line interface and shared action library (every action here is real, tested, and reused by the web API)."

[lib]
name = "simorph_cli"
path = "src/lib.rs"

[[bin]]
name = "simorph"
path = "src/main.rs"

[dependencies]
simorph-core = { path = "../../crates/simorph-core" }
simorph-units = { path = "../../crates/simorph-units" }
simorph-provenance = { path = "../../crates/simorph-provenance" }
simorph-model-registry = { path = "../../crates/simorph-model-registry" }
simorph-experiment = { path = "../../crates/simorph-experiment" }
simorph-validation = { path = "../../crates/simorph-validation" }
simorph-uncertainty = { path = "../../crates/simorph-uncertainty" }
simorph-optimization = { path = "../../crates/simorph-optimization" }
simorph-simulation = { path = "../../crates/simorph-simulation" }
simorph-plugin-sdk = { path = "../../crates/simorph-plugin-sdk" }
simorph-telemetry = { path = "../../crates/simorph-telemetry" }
simorph-svc-scientific-director = { path = "../../services/scientific-director" }
simorph-svc-campaign-runtime = { path = "../../services/campaign-runtime" }
simorph-svc-ai-laboratory = { path = "../../services/ai-laboratory" }
simorph-svc-model-factory = { path = "../../services/model-factory" }
simorph-svc-simulator-factory = { path = "../../services/simulator-factory" }
simorph-svc-knowledge-service = { path = "../../services/knowledge-service" }
simorph-plugin-physics = { path = "../../plugins/physics" }
simorph-plugin-engineering = { path = "../../plugins/engineering" }
simorph-plugin-ai = { path = "../../plugins/ai" }
simorph-adapter-python-bridge = { path = "../../adapters/python-bridge" }
simorph-adapter-scientific-python = { path = "../../adapters/scientific-python" }
simorph-formal = { path = "../../crates/simorph-formal" }
simorph-svc-improvement-loop = { path = "../../services/improvement-loop" }
simorph-multimodal = { path = "../../crates/simorph-multimodal" }
simorph-evolution = { path = "../../crates/simorph-evolution" }
simorph-distributed = { path = "../../crates/simorph-distributed" }
simorph-svc-problem-understanding = { path = "../../services/problem-understanding" }
simorph-svc-agents = { path = "../../services/agents" }
simorph-connectors = { path = "../../crates/simorph-connectors" }
simorph-adapter-fmi = { path = "../../adapters/fmi" }
simorph-security = { path = "../../crates/simorph-security" }
